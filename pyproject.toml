[project]
name = "puppybot"
version = "0.1.0"
description = "a bot that retweets images of puppies"
authors = [
    {name = "Daniel Loiola",email = "danf10@me.com"}
]
readme = "README.md"
requires-python = ">=3.13, <3.15"
dependencies = [
    "websockets (>=15,<16)",
    "atproto (>=0.0.65,<0.0.66)",
    "tensorflow (>=2.18)",
    "pillow (>=11)",
    "requests (>=2.32)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
